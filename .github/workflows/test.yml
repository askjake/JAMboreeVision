name: Test
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-ocr.txt
      - run: python verify.py
      - name: Windows service file ACL regression
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\tests\windows_service_acl.ps1
          .\tests\windows_service_health.ps1
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/live_player.cjs
